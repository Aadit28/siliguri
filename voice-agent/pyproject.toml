[project]
name = "saathi-voice-agent"
version = "0.1.0"
description = "Saathi elder-care voice agent - week 1 text mode (tool loop, state machine, eval harness)"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.40",
  "httpx>=0.27",
  "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["saathi_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
